<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio de Daniel Troncoso</title>
<meta name="description" content="Proyectos, automatizaciones y flujos de trabajo construidos con IA. Cada proyecto se abre como una app, con su historia paso a paso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Daniel OS: tres de sus apps se llaman «OS», así que el portafolio es su escritorio.
     Cada proyecto es una app, y al abrirla sale una ventana con su historia. */
  /* Los colores, todos aquí: una paleta nueva sólo cambia este bloque. */
  /* «Escritorio claro y rojo señal», la 7 de maquetas/paletas.html, elegida el 14-nov-2026. */
  :root {
    --mesa: #D3D1C9;        /* el escritorio: papel gris claro, plano */
    --papel: #FFFFFF;       /* el interior de las ventanas */
    --negro: #111111;       /* bordes y texto */
    --activa: #E8432E;      /* el acento: la barra de la ventana de delante y el botón principal */
    --inactiva: #E6E4DE;
    --gris: #54555A;
    --raya: #D7D5CE;
    --mira: #111111;        /* las esquinas de los iconos y el foco: en negro, porque el rojo no se distingue sobre el gris claro */
    --sobre-mesa: #141414;  /* el texto que va directamente sobre el escritorio */
    --sombra-nombre: none;
    --malla: 40, 40, 40;    /* las líneas del fondo, en r, g, b: como de lápiz */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--mesa); color: var(--negro); font: 400 16px/1.5 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden; }
  :focus-visible { outline: 3px solid var(--mira); outline-offset: 2px; }
  a { color: var(--negro); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  /* La malla vive debajo de todo: sólo se ve en el escritorio vacío. */
  #malla { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  /* La barra de tareas, abajo como en un ordenador: «Daniel OS» abre el Léeme, cada ventana
     abierta tiene su botón (la de delante, en el color de acento), y a la derecha la hora y la fecha. */
  /* La barra va en la letra del sistema (Segoe UI en Windows): la de la página tacha el cero. */
  .tareas { position: fixed; inset: auto 0 0 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px; background: var(--papel); border-top: 2px solid var(--negro); z-index: 9999; font: 400 14px/1.3 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .tareas .inicio { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 5px; flex-shrink: 0; font: inherit; color: var(--negro); background: none; border: 0; border-radius: 4px; cursor: pointer; }
  .tareas .inicio:hover { background: rgba(0, 0, 0, 0.07); }
  .tareas .inicio[aria-expanded="true"] { background: rgba(0, 0, 0, 0.12); }
  .tareas .inicio img, .tareas .inicio .sin-foto { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 1.5px solid var(--negro); background: var(--activa); }
  .tareas .abiertas { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; }
  .tareas .sistema { display: flex; gap: 10px; color: var(--negro); }
  .tareas .sistema svg { display: block; }

  /* El menú de inicio: quién es (lo de arriba del Léeme) y en qué ha trabajado esta semana. */
  .menu { position: fixed; left: 8px; bottom: 52px; z-index: 10000; width: 380px; max-height: calc(100vh - 68px); overflow: auto; background: var(--papel); border: 2px solid var(--negro); box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35); padding: 18px; }
  .menu[hidden] { display: none; }
  .menu .yo { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
  .menu .yo img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 2px solid var(--negro); }
  .menu .yo h2 { margin: 0; font-size: 20px; line-height: 1.15; }
  .menu .yo p { margin: 2px 0 0; color: var(--gris); font-size: 14px; line-height: 1.35; }
  .menu .mas { margin: 14px 0 18px; }
  .menu h3 { margin: 0 0 6px; font-size: 14px; color: var(--gris); font-weight: 700; }
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu li button { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border: 0; background: none; font: inherit; color: var(--negro); cursor: pointer; }
  .menu li button:hover { background: var(--inactiva); }
  .menu li img, .menu li .letra { width: 44px; height: 44px; object-fit: cover; object-position: top left; border: 1.5px solid var(--negro); border-radius: 6px; display: grid; place-items: center; font-weight: 700; background: var(--inactiva); }
  .menu li b { display: block; font-size: 15px; }
  .menu li small { display: block; color: var(--gris); font-size: 13px; line-height: 1.3; }
  .tareas .abiertas button { min-width: 0; max-width: 180px; height: 32px; padding: 0 12px; font: inherit; color: var(--negro); background: var(--inactiva); border: 2px solid var(--negro); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tareas .abiertas button[aria-current="true"] { background: var(--activa); font-weight: 700; }
  .tareas .bandeja { display: flex; align-items: center; gap: 16px; padding-right: 6px; white-space: nowrap; flex-shrink: 0; }
  .tareas .ultimo { color: var(--gris); }
  .tareas time { display: grid; text-align: right; line-height: 1.15; font-size: 13px; }
  .tareas time b { font-size: 14px; }

  .iconos { position: absolute; z-index: 1; top: 16px; left: 16px; bottom: 60px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 112px); gap: 8px 12px; align-content: start; }
  /* Cada icono lleva una mira: cuatro esquinas que se cierran sobre él al pasar el ratón
     o al llegar con el teclado, y que se quedan puestas en el de la ventana que tienes delante. */
  .icono { width: 104px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--sobre-mesa); font: inherit; }
  .icono:focus-visible { outline: none; }
  .icono .mira { position: relative; display: block; padding: 7px; }
  .icono .esquinas { position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: scale(1.18); transition: opacity 120ms ease-out, transform 160ms ease-out; }
  .icono .esquina { position: absolute; width: 13px; height: 13px; border: 0 solid var(--mira); }
  .icono .arr-izq { top: 0; left: 0; border-width: 3px 0 0 3px; }
  .icono .arr-der { top: 0; right: 0; border-width: 3px 3px 0 0; }
  .icono .aba-izq { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
  .icono .aba-der { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
  .icono:hover .esquinas, .icono:focus-visible .esquinas, .icono[aria-pressed="true"] .esquinas { opacity: 1; transform: none; }
  .icono .cara { width: 56px; height: 56px; border: 2px solid var(--negro); border-radius: 10px; overflow: hidden; background: var(--c); display: grid; place-items: center; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35); font-weight: 700; font-size: 24px; color: var(--negro); }
  .icono .cara img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .icono .nombre { font-size: 14px; line-height: 1.25; text-align: center; padding: 1px 4px; text-shadow: var(--sombra-nombre); }
  .icono:focus-visible .nombre { text-decoration: underline 2px; text-underline-offset: 3px; }
  .doc { background: var(--papel) !important; }
  .doc .tinta { fill: var(--papel); stroke: var(--negro); }
  .doc .trazo { stroke: var(--negro); }
  .doc .medalla { fill: var(--activa); stroke: var(--negro); }
  .icono .foto img { object-position: center 20%; }
  .cara.cert { background: var(--negro); }
  .cert .papel { fill: var(--papel); }
  .cert .linea { stroke: var(--negro); }
  .cert .medalla { fill: var(--activa); stroke: var(--negro); }
  .cert .visto { stroke: var(--papel); }

  .ventana { position: absolute; z-index: 2; background: var(--papel); border: 2px solid var(--negro); box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; max-height: calc(100vh - 60px); min-width: 320px; }
  .ventana .titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 6px 14px; background: var(--inactiva); border-bottom: 2px solid var(--negro); cursor: grab; user-select: none; touch-action: none; }
  .ventana.activa .titulo { background: var(--activa); }
  .ventana .titulo h2 { margin: 0; font-size: 16px; }
  .ventana .cerrar { width: 28px; height: 28px; border: 2px solid var(--negro); background: var(--papel); font: 700 15px 'Atkinson Hyperlegible', sans-serif; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .ventana .cuerpo { overflow: auto; padding: 20px; }

  .leeme { display: grid; grid-template-columns: 96px 1fr; gap: 20px; }
  .leeme img { width: 96px; height: 96px; object-fit: cover; border: 2px solid var(--negro); }
  .leeme h3 { font-size: 30px; line-height: 1.1; margin: 0 0 6px; }
  .leeme .rol { margin: 0 0 16px; font-size: 18px; }
  .leeme h4 { margin: 14px 0 2px; font-size: 16px; }
  .leeme p { margin: 0; color: var(--gris); max-width: 60ch; }
  .leeme .pie { margin-top: 16px; color: var(--negro); display: flex; gap: 16px; flex-wrap: wrap; }

  .app .que { margin: 0 0 12px; color: var(--gris); max-width: 72ch; }
  .app .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .boton { display: inline-block; font: 700 14px 'Atkinson Hyperlegible', sans-serif; color: var(--negro); background: var(--papel); border: 2px solid var(--negro); padding: 6px 14px; text-decoration: none; cursor: pointer; box-shadow: 3px 3px 0 var(--negro); }
  .boton:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--negro); }
  .boton.principal { background: var(--activa); }
  .app video.demo { width: 100%; display: block; border: 2px solid var(--negro); background: #000; max-height: 360px; margin-bottom: 16px; }
  .app .partes { display: grid; grid-template-columns: 250px 1fr; gap: 20px; min-height: 0; }
  .app .partes > * { min-width: 0; }
  .app ol { list-style: none; margin: 0; padding: 0; border: 2px solid var(--negro); max-height: 420px; overflow: auto; }
  .app ol button { display: grid; grid-template-columns: 26px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--raya); background: none; padding: 8px 10px; font: inherit; font-size: 14px; line-height: 1.35; cursor: pointer; }
  .app ol .num { font-weight: 700; font-size: 13px; color: var(--gris); padding-top: 1px; }
  .app ol small { display: block; color: var(--gris); font-size: 13px; }
  .app ol .menor { color: var(--gris); }
  .app ol button[aria-current="true"] { background: var(--negro); color: var(--papel); }
  .app ol button[aria-current="true"] small, .app ol button[aria-current="true"] .num { color: #C9C9C9; }
  .app .todos { margin-top: 12px; }
  .app .vista .grande { width: 100%; display: block; border: 2px solid var(--negro); max-height: 360px; object-fit: cover; object-position: top left; background: #000; }
  .app .vista h3 { font-size: 22px; line-height: 1.2; margin: 14px 0 4px; }
  .app .vista .cuando { color: var(--gris); font-size: 14px; margin-bottom: 8px; }
  .app .vista p { margin: 0; max-width: 64ch; }
  .app .vista .aparte { display: inline-block; margin-top: 12px; font-size: 14px; }
  .app .vacia { border: 2px dashed var(--gris); padding: 28px; color: var(--gris); }
  .app .mini { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .app .mini button { padding: 0; border: 2px solid transparent; background: #000; cursor: pointer; position: relative; }
  .app .mini button[aria-current="true"] { border-color: var(--negro); outline: 2px solid var(--activa); }
  .app .mini img, .app .mini video { display: block; width: 64px; height: 42px; object-fit: cover; object-position: top left; pointer-events: none; }
  .app .mini .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 14px; text-shadow: 0 0 4px #000; }

  .certs .cert { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--raya); }
  .certs .cert:last-child { border-bottom: 0; }
  .certs img { width: 64px; height: 64px; object-fit: contain; }
  .certs h3 { margin: 4px 0 0; font-size: 18px; line-height: 1.25; }
  .certs .emisor { margin: 0; color: var(--gris); font-size: 14px; }
  .certs .desc { margin: 6px 0 8px; font-size: 15px; }
  .certs .verif { display: inline-block; font-size: 13px; font-weight: 700; border: 2px solid var(--negro); padding: 0 6px; background: #CDEFD9; }
  .certs .fecha { color: var(--gris); font-size: 13px; margin-left: 8px; }

  .pista { position: absolute; z-index: 1; right: 20px; bottom: 60px; color: var(--sobre-mesa); text-shadow: var(--sombra-nombre); font-size: 14px; margin: 0; }
  body:has(.ventana) .pista { visibility: hidden; }
  noscript p { position: relative; z-index: 3; margin: 80px auto; max-width: 560px; background: var(--papel); border: 2px solid var(--negro); padding: 20px; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .iconos { position: relative; inset: auto; padding: 16px 16px 24px; display: grid; grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-template-rows: none; gap: 16px 4px; }
    .icono { width: auto; }
    .ventana { position: fixed; inset: 0 0 44px 0 !important; width: auto !important; max-height: none; min-width: 0; box-shadow: none; border-width: 0; }
    .tareas { gap: 6px; padding: 0 6px; }
    .tareas .ultimo, .tareas .sistema { display: none; }
    .menu { left: 0; right: 0; bottom: 44px; width: auto; box-shadow: none; border-width: 2px 0 0; }
    .tareas .abiertas button { padding: 0 8px; }
    .ventana .titulo { cursor: default; }
    .leeme { grid-template-columns: 1fr; }
    .app .partes { grid-template-columns: 1fr; }
    .app ol { max-height: 220px; }
    .pista { position: relative; display: block; padding: 0 16px 68px; right: auto; bottom: auto; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .ventana.nueva { animation: abrir 140ms ease-out; }
    @keyframes abrir { from { transform: scale(0.96); opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) {
    .icono .esquinas { transition: none; }
  }
</style>
</head>
<body>
<canvas id="malla" aria-hidden="true"></canvas>
<nav class="iconos" id="iconos" aria-label="Proyectos y documentos"></nav>
<p class="pista" id="pista"></p>
<div id="ventanas"></div>
<footer class="tareas" aria-label="Barra de tareas">
  <button class="inicio" id="inicio" type="button" aria-expanded="false" aria-controls="menu"><span class="sin-foto" aria-hidden="true"></span><span id="nombre">Daniel Troncoso</span></button>
  <div class="abiertas" id="abiertas" aria-label="Ventanas abiertas"></div>
  <div class="bandeja"><span class="ultimo" id="ultimo"></span>
    <span class="sistema" aria-hidden="true">
      <svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="6" y="1.5" width="12.5" height="9" rx="1"/><path d="M12.25 10.5v3.5M9.5 14h5.5M1 4.5h3V15h5"/></svg>
      <svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M2 6.5h3.2L9.5 3v12L5.2 11.5H2z"/><path d="M13 6.2a3.6 3.6 0 0 1 0 5.6M15.6 3.8a7 7 0 0 1 0 10.4"/></svg>
    </span>
    <time id="reloj"></time></div>
</footer>
<div class="menu" id="menu" role="dialog" aria-label="Inicio" hidden></div>
<noscript><p>Este portafolio abre cada proyecto en su ventana, y para eso necesita JavaScript. Todo lo que enseña está también en <a href="proyectos.json">proyectos.json</a> y <a href="logros.json">logros.json</a>.</p></noscript>

<script>
/* El fondo: líneas finas, como curvas de nivel, que ceden bajo el puntero y vuelven a su sitio.
   Viene de una prueba hecha con Gemini (fondo-07). Su color sale de --malla, así que una paleta
   nueva lo cambia sin tocar esto. Con «reducir movimiento» se queda quieta; en reposo no gasta. */
(function () {
  var lienzo = document.getElementById('malla'), ctx = lienzo.getContext('2d');
  var quieta = matchMedia('(prefers-reduced-motion: reduce)');
  var ALCANCE = 155, FILA = 36, COLUMNA = 28;
  var ancho = 0, alto = 0, lineas = [], cuadro = null, espera = null, yAntes = null;
  var puntero = { x: -999, y: -999, vy: 0, activo: false };

  function tejer() {
    lineas = [];
    var cols = Math.ceil(ancho / COLUMNA) + 2;
    for (var y = FILA * 0.6; y < alto; y += FILA) {
      var pts = [];
      for (var c = 0; c < cols; c++) pts.push({ x: (c - 0.5) * COLUMNA, y: y, dy: 0, vy: 0 });
      lineas.push(pts);
    }
  }
  // Cada vértice es un muelle: el puntero lo empuja y él vuelve a su sitio. Dice si algo se sigue moviendo.
  function dibujar() {
    var color = getComputedStyle(document.documentElement).getPropertyValue('--malla').trim() || '232, 240, 243';
    var seMueve = false;
    ctx.clearRect(0, 0, ancho, alto);
    ctx.lineWidth = 1;
    lineas.forEach(function (pts) {
      var curva = 0;
      pts.forEach(function (p) {
        if (puntero.activo && !quieta.matches) {
          var dist = Math.hypot(p.x - puntero.x, p.y - puntero.y);
          if (dist < ALCANCE) {
            var f = Math.pow(1 - dist / ALCANCE, 2);
            var empuje = (p.y >= puntero.y ? 1 : -1) * 26 * f + puntero.vy * 0.45 * f;
            p.vy += (empuje - p.dy) * 0.12;
          }
        }
        p.vy += -p.dy * 0.085; p.vy *= 0.82; p.dy += p.vy;
        if (Math.abs(p.dy) > 0.08 || Math.abs(p.vy) > 0.04) { seMueve = true; curva = Math.max(curva, Math.abs(p.dy)); }
        else { p.dy = 0; p.vy = 0; }
      });
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y + pts[0].dy);
      for (var c = 1; c < pts.length - 1; c++) {
        ctx.quadraticCurveTo(pts[c].x, pts[c].y + pts[c].dy,
          (pts[c].x + pts[c + 1].x) / 2, (pts[c].y + pts[c].dy + pts[c + 1].y + pts[c + 1].dy) / 2);
      }
      ctx.strokeStyle = 'rgba(' + color + ', ' + Math.min(0.32, 0.085 + curva * 0.008).toFixed(3) + ')';
      ctx.stroke();
    });
    return seMueve;
  }
  function paso() {
    var sigue = dibujar();
    puntero.vy *= 0.7;
    cuadro = (sigue || puntero.activo) && !quieta.matches ? requestAnimationFrame(paso) : null;
  }
  function medir() {
    var r = Math.min(window.devicePixelRatio || 1, 2);
    ancho = innerWidth; alto = innerHeight;
    lienzo.width = Math.floor(ancho * r); lienzo.height = Math.floor(alto * r);
    ctx.setTransform(r, 0, 0, r, 0, 0);
    tejer(); dibujar();
  }
  addEventListener('pointermove', function (e) {
    if (quieta.matches) return;
    puntero.vy = yAntes !== null ? Math.max(-28, Math.min(28, e.clientY - yAntes)) : 0;
    yAntes = e.clientY;
    puntero.x = e.clientX; puntero.y = e.clientY; puntero.activo = true;
    clearTimeout(espera);
    espera = setTimeout(function () { puntero.activo = false; yAntes = null; }, 160);
    if (!cuadro) cuadro = requestAnimationFrame(paso);
  }, { passive: true });
  addEventListener('resize', medir);
  quieta.addEventListener('change', medir);
  medir();
})();

(function () {
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var COLOR = { app: '#8FC3FF', juego: '#FFB3D6', automatizacion: '#F7C969', flujo: '#8EE0B4' };
  var movil = matchMedia('(max-width: 760px)');
  var BARRA = 44; // el alto de la barra de tareas, como en el CSS
  var menu = document.getElementById('menu'), inicio = document.getElementById('inicio');
  var capa = 10, abiertas = {}, verTodos = {};
  var d = { perfil: {}, certificaciones: [], proyectos: [], logros: [] };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fecha(iso) { var p = String(iso).split('-'); return p.length === 3 ? (+p[2]) + ' ' + MESES[+p[1] - 1] + ' ' + p[0] : esc(iso); }
  function esVideo(c) { return /\.mp4$/i.test(c); }
  function proyecto(id) { return d.proyectos.filter(function (p) { return p.id === id; })[0]; }
  function logrosDe(id) { return d.logros.filter(function (l) { return l.proyecto === id; }); }
  // Si un proyecto no marcó ningún hito, su historia son todos sus logros: nunca sale vacía.
  function hitosDe(id) { var ls = logrosDe(id), h = ls.filter(function (l) { return l.hito; }); return h.length ? h : ls; }
  function portada(id) {
    var ls = hitosDe(id).concat(logrosDe(id));
    for (var i = 0; i < ls.length; i++) {
      var cs = (ls[i].capturas || []).filter(function (c) { return !esVideo(c); });
      var ancha = cs.filter(function (c) { return !/-390\./.test(c); })[0] || cs[0];
      if (ancha) return ancha;
    }
    return null;
  }

  // Cuántos días hace de una fecha AAAA-MM-DD, contando desde hoy en el reloj de quien mira.
  function dias(iso) {
    var p = String(iso).split('-'), hoy = new Date();
    return Math.round((new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) - new Date(+p[0], p[1] - 1, +p[2])) / 864e5);
  }
  function hace(n) { return n <= 0 ? 'Hoy' : n === 1 ? 'Ayer' : 'Hace ' + n + ' días'; }
  // Los proyectos en los que ha trabajado esta semana (un avance en los últimos 7 días), del más
  // reciente al más viejo. Si en 7 días no hubo ninguno, los tres últimos, para que nunca salga vacío.
  function recientes() {
    var ultimo = {};
    d.logros.forEach(function (l) { if (!ultimo[l.proyecto] && proyecto(l.proyecto)) ultimo[l.proyecto] = l; });
    var lista = Object.keys(ultimo).map(function (id) { return ultimo[id]; });
    var semana = lista.filter(function (l) { return dias(l.fecha) <= 7; });
    return semana.length ? { titulo: 'En lo que trabajo esta semana', lista: semana.slice(0, 5) } : { titulo: 'Lo último en lo que he trabajado', lista: lista.slice(0, 3) };
  }
  function pintarMenu() {
    var f = d.perfil, r = recientes();
    menu.innerHTML = '<div class="yo">' + (f.foto ? '<img src="' + esc(f.foto) + '" alt="">' : '<span></span>') +
      '<div><h2>' + esc(f.nombre) + '</h2><p>' + esc(f.rol) + '</p></div></div>' +
      '<button class="boton principal mas" type="button" data-abrir="leeme">Leer quién soy</button>' +
      (r.lista.length ? '<h3>' + r.titulo + '</h3><ul>' + r.lista.map(function (l) {
        var p = proyecto(l.proyecto), img = portada(p.id);
        return '<li><button type="button" data-abrir="' + esc(p.id) + '">' + (img ? '<img src="' + esc(img) + '" alt="">' : '<span class="letra">' + esc(p.nombre.charAt(0)) + '</span>') +
          '<span><b>' + esc(p.nombre) + '</b><small>' + hace(dias(l.fecha)) + ': ' + esc(l.titulo) + '</small></span></button></li>';
      }).join('') + '</ul>' : '');
  }
  function menuAbierto(si) {
    if (si) pintarMenu();
    menu.hidden = !si;
    inicio.setAttribute('aria-expanded', String(si));
    if (si) menu.querySelector('button').focus();
  }

  function pintarEscritorio() {
    var f = d.perfil;
    if (f.nombre) document.getElementById('nombre').textContent = f.nombre;
    if (f.foto) inicio.querySelector('.sin-foto').outerHTML = '<img src="' + esc(f.foto) + '" alt="">';
    var ultimo = d.logros[0];
    document.getElementById('ultimo').textContent = ultimo ? 'Último avance: ' + fecha(ultimo.fecha) : '';
    document.getElementById('pista').textContent = d.proyectos.length + ' proyectos y ' + d.logros.length + ' avances. Abre uno para ver su historia.';
    var iconos = [{ id: 'leeme', nombre: 'Léeme', doc: true }].concat(d.proyectos.map(function (p) { return { id: p.id, nombre: p.nombre, p: p }; }));
    if (d.certificaciones.length) iconos.push({ id: 'certificados', nombre: 'Certificados', doc: true });
    document.getElementById('iconos').innerHTML = iconos.map(function (it) {
      var cara;
      // El Léeme lleva la foto de Daniel; Certificados, un diploma con su sello, sobre oscuro para que resalte.
      if (it.id === 'leeme') cara = '<span class="cara doc foto" aria-hidden="true">' + (d.perfil.foto
        ? '<img src="' + esc(d.perfil.foto) + '" alt="">'
        : '<svg width="26" height="30" viewBox="0 0 26 30"><path class="tinta" d="M2 2h15l7 7v19H2z" stroke-width="2"/><path class="trazo" d="M6 13h14M6 18h14M6 23h9" stroke-width="2"/></svg>') + '</span>';
      else if (it.doc) cara = '<span class="cara cert" aria-hidden="true">' +
        '<svg width="44" height="40" viewBox="0 0 44 40"><rect class="papel" x="3" y="5" width="32" height="24" rx="1.5"/><path class="linea" d="M8 12h22M8 17h15M8 22h10" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path class="medalla" d="M28 28l-3 10 6-3.2 6 3.2-3-10z" stroke-width="2"/><circle class="medalla" cx="31" cy="25" r="8" stroke-width="2"/><path class="visto" d="M27.4 25.2l2.6 2.6 4.6-5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>';
      else {
        var img = portada(it.id);
        cara = '<span class="cara" style="--c:' + (COLOR[it.p.tipo] || '#ccc') + '" aria-hidden="true">' + (img ? '<img src="' + esc(img) + '" alt="">' : esc(it.nombre.charAt(0))) + '</span>';
      }
      return '<button class="icono" type="button" data-abrir="' + esc(it.id) + '" aria-pressed="false"><span class="mira">' +
        '<span class="esquinas" aria-hidden="true"><span class="esquina arr-izq"></span><span class="esquina arr-der"></span><span class="esquina aba-izq"></span><span class="esquina aba-der"></span></span>' +
        cara + '</span><span class="nombre">' + esc(it.nombre) + '</span></button>';
    }).join('');
  }

  function contenido(id) {
    if (id === 'leeme') {
      var f = d.perfil;
      return { titulo: 'Léeme', ancho: 640, html: '<div class="leeme">' + (f.foto ? '<img src="' + esc(f.foto) + '" alt="Daniel Troncoso">' : '<span></span>') +
        '<div><h3>' + esc(f.nombre) + '</h3><p class="rol">' + esc(f.rol) + '</p>' +
        (f.quien ? '<h4>Quién soy</h4><p>' + esc(f.quien) + '</p>' : '') +
        (f.porque ? '<h4>Por qué lo hago</h4><p>' + esc(f.porque) + '</p>' : '') +
        (f.busca ? '<h4>Qué busco</h4><p>' + esc(f.busca) + '</p>' : '') +
        '<p class="pie">' + (f.enlaces || []).map(function (e) { return '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">Mi ' + esc(e.nombre) + '</a>'; }).join('') + '</p></div></div>' };
    }
    if (id === 'certificados') {
      return { titulo: 'Certificados', ancho: 560, html: '<div class="certs">' + d.certificaciones.map(function (k) {
        return '<div class="cert">' + (k.badge ? '<img src="' + esc(k.badge) + '" alt="Insignia de ' + esc(k.nombre) + '">' : '<span></span>') +
          '<div>' + (k.verificada ? '<span class="verif">Verificada</span>' : '') + '<span class="fecha">' + fecha(k.fecha) + '</span>' +
          '<h3>' + esc(k.nombre) + '</h3><p class="emisor">' + esc(k.emisor) + '</p>' +
          (k.descripcion ? '<p class="desc">' + esc(k.descripcion) + '</p>' : '') +
          (k.url ? '<a href="' + esc(k.url) + '" target="_blank" rel="noopener">Ver la credencial oficial</a>' : '') + '</div></div>';
      }).join('') + '</div>' };
    }
    var p = proyecto(id);
    if (!p) return null;
    return { titulo: p.nombre, ancho: 860, html: '<div class="app">' +
      '<p class="que">' + esc(p.que) + '</p>' + (p.historia ? '<p class="que">' + esc(p.historia) + '</p>' : '') +
      ((p.url || p.repo) ? '<div class="acciones">' +
        (p.url ? '<a class="boton principal" href="' + esc(p.url) + '" target="_blank" rel="noopener">Verlo en vivo</a>' : '') +
        (p.repo ? '<a class="boton" href="' + esc(p.repo) + '" target="_blank" rel="noopener">El código</a>' : '') + '</div>' : '') +
      (p.video ? '<video class="demo" src="' + esc(p.video) + '" controls playsinline preload="metadata"' + (portada(id) ? ' poster="' + esc(portada(id)) + '"' : '') + '></video>' : '') +
      '<div class="historia"></div></div>' };
  }

  // La historia de un proyecto: los hitos numerados en orden, del último al primero;
  // los avances pequeños, detrás de un botón.
  function pintarHistoria(v) {
    var id = v.dataset.v, caja = v.querySelector('.historia');
    var hitos = hitosDe(id), todos = logrosDe(id), menores = todos.length - hitos.length;
    if (!todos.length) { caja.innerHTML = '<div class="vacia">Este proyecto todavía no tiene avances apuntados. El primero saldrá aquí.</div>'; return; }
    var orden = hitos.slice().reverse();
    var lista = verTodos[id] ? todos : hitos;
    caja.innerHTML = '<div class="partes"><div><ol>' + lista.map(function (l, i) {
      var n = orden.indexOf(l);
      return '<li><button type="button" data-logro="' + esc(l.id) + '" aria-current="' + (i === 0) + '"' + (n < 0 ? ' class="menor"' : '') + '>' +
        '<span class="num">' + (n < 0 ? '' : n + 1) + '</span><span>' + esc(l.titulo) + '<small>' + fecha(l.fecha) + (l.etapa ? ', ' + esc(l.etapa.toLowerCase()) : '') + '</small></span></button></li>';
    }).join('') + '</ol>' +
      (menores > 0 ? '<button class="boton todos" type="button" data-todos>' + (verTodos[id] ? 'Ver sólo los pasos grandes' : menores === 1 ? 'Ver también el avance pequeño' : 'Ver también los ' + menores + ' avances pequeños') + '</button>' : '') +
      '</div><div class="vista"></div></div>';
    verLogro(v, lista[0].id);
  }

  function medio(src, alt) {
    return esVideo(src)
      ? '<video class="grande" src="' + esc(src) + '" controls playsinline preload="metadata"></video>'
      : '<img class="grande" src="' + esc(src) + '" alt="' + esc(alt) + '">';
  }
  function verLogro(v, id) {
    var l = d.logros.filter(function (x) { return x.id === id; })[0]; if (!l) return;
    v.querySelectorAll('[data-logro]').forEach(function (b) { b.setAttribute('aria-current', String(b.dataset.logro === id)); });
    var cs = l.capturas || [];
    v.querySelector('.vista').innerHTML =
      (cs.length ? '<div class="medio">' + medio(cs[0], 'Captura: ' + l.titulo) + '</div>' : '') +
      (cs.length > 1 ? '<div class="mini">' + cs.map(function (s, i) {
        return '<button type="button" data-medio="' + esc(s) + '" aria-current="' + (i === 0) + '" aria-label="' + (esVideo(s) ? 'Vídeo ' : 'Captura ') + (i + 1) + '">' +
          (esVideo(s) ? '<video src="' + esc(s) + '" muted playsinline preload="metadata"></video><span class="play" aria-hidden="true">▶</span>' : '<img src="' + esc(s) + '" alt="">') + '</button>';
      }).join('') + '</div>' : '') +
      (cs.length ? '<a class="aparte" href="' + esc(cs[0]) + '" target="_blank" rel="noopener">Abrir aparte, a tamaño completo</a>' : '') +
      '<h3>' + esc(l.titulo) + '</h3><div class="cuando">' + fecha(l.fecha) + (l.ia && l.ia.length ? ', hecho con ' + esc(l.ia.join(' y ')) : '') + '</div>' +
      (l.texto ? '<p>' + esc(l.texto) + '</p>' : '');
  }

  function alFrente(v) {
    v.style.zIndex = ++capa;
    document.querySelectorAll('.ventana').forEach(function (x) { x.classList.toggle('activa', x === v); });
    document.querySelectorAll('.icono').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.abrir === v.dataset.v)); });
    pintarTareas();
  }
  // Un botón por ventana abierta, en el orden en que se abrieron; el de la de delante, marcado.
  function pintarTareas() {
    var delante = document.querySelector('.ventana.activa');
    document.getElementById('abiertas').innerHTML = Object.keys(abiertas).map(function (id) {
      var t = abiertas[id].getAttribute('aria-label');
      return '<button type="button" data-ir="' + esc(id) + '" aria-current="' + (abiertas[id] === delante) + '" title="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');
  }
  function reloj() {
    var a = new Date(), r = document.getElementById('reloj');
    r.dateTime = a.toISOString();
    r.innerHTML = '<b>' + a.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '</b>' + a.toLocaleDateString('es-ES');
  }
  reloj(); setInterval(reloj, 15000);

  // Cada proyecto tiene su dirección, #/<id>, para poder compartirlo.
  function ponerRuta(id) {
    var nueva = proyecto(id) ? '#/' + encodeURIComponent(id) : location.pathname + location.search;
    if (location.hash !== nueva) history.replaceState(null, '', nueva);
    var p = proyecto(id);
    document.title = (p ? p.nombre + ', en el ' : '') + 'Portafolio de ' + (d.perfil.nombre || 'Daniel');
  }

  function abrir(id, x, y) {
    if (abiertas[id]) { alFrente(abiertas[id]); ponerRuta(id); abiertas[id].querySelector('.cerrar').focus(); return; }
    var c = contenido(id); if (!c) return;
    var n = Object.keys(abiertas).length;
    var v = document.createElement('section');
    v.className = 'ventana nueva'; v.dataset.v = id;
    v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', c.titulo);
    var ancho = Math.min(c.ancho, innerWidth - 160);
    v.style.width = ancho + 'px';
    v.style.left = (x != null ? x : Math.max(140, Math.min(150 + n * 36, innerWidth - ancho - 20))) + 'px';
    var arriba = y != null ? y : 20 + n * 32;
    v.style.top = arriba + 'px';
    if (!movil.matches) v.style.maxHeight = (innerHeight - arriba - BARRA - 16) + 'px'; // que no se meta bajo la barra de tareas
    v.innerHTML = '<div class="titulo"><h2>' + esc(c.titulo) + '</h2><button class="cerrar" type="button" aria-label="Cerrar ' + esc(c.titulo) + '">✕</button></div><div class="cuerpo">' + c.html + '</div>';
    document.getElementById('ventanas').appendChild(v);
    abiertas[id] = v;
    if (v.querySelector('.historia')) pintarHistoria(v);
    alFrente(v);
    ponerRuta(id);
    v.querySelector('.cerrar').focus();
  }
  function cerrar(v) {
    delete abiertas[v.dataset.v]; v.remove();
    var resto = document.querySelectorAll('.ventana');
    if (resto.length) { var arriba = [].slice.call(resto).sort(function (a, b) { return b.style.zIndex - a.style.zIndex; })[0]; alFrente(arriba); ponerRuta(arriba.dataset.v); }
    else { document.querySelectorAll('.icono').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); ponerRuta(null); pintarTareas(); }
    var ic = document.querySelector('[data-abrir="' + v.dataset.v + '"]'); if (ic) ic.focus();
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('#inicio')) { menuAbierto(menu.hidden); return; }
    if (!menu.hidden && !e.target.closest('#menu')) menuAbierto(false); // un clic fuera lo cierra
    var a = e.target.closest('[data-abrir]'); if (a) { menuAbierto(false); abrir(a.dataset.abrir); return; }
    var ir = e.target.closest('[data-ir]'); if (ir) { abrir(ir.dataset.ir); return; }
    var c = e.target.closest('.cerrar'); if (c) { cerrar(c.closest('.ventana')); return; }
    var t = e.target.closest('[data-todos]');
    if (t) { var vt = t.closest('.ventana'); verTodos[vt.dataset.v] = !verTodos[vt.dataset.v]; pintarHistoria(vt); return; }
    var l = e.target.closest('[data-logro]'); if (l) { verLogro(l.closest('.ventana'), l.dataset.logro); return; }
    var m = e.target.closest('[data-medio]');
    if (m) {
      var v = m.closest('.ventana');
      v.querySelector('.medio').innerHTML = medio(m.dataset.medio, '');
      v.querySelector('.aparte').href = m.dataset.medio;
      v.querySelectorAll('[data-medio]').forEach(function (b) { b.setAttribute('aria-current', String(b === m)); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) { menuAbierto(false); inicio.focus(); return; }
    if (e.key === 'Escape') { var act = document.querySelector('.ventana.activa'); if (act) cerrar(act); }
  });
  window.addEventListener('hashchange', function () {
    var m = /^#\/(.+)$/.exec(location.hash);
    if (m) abrir(decodeURIComponent(m[1]));
  });

  // Arrastrar una ventana por su barra; en el móvil las ventanas ocupan la pantalla y no se arrastran.
  document.addEventListener('pointerdown', function (e) {
    var v = e.target.closest('.ventana'); if (!v) return;
    if (!v.classList.contains('activa')) { alFrente(v); ponerRuta(v.dataset.v); }
    var t = e.target.closest('.titulo');
    if (!t || e.target.closest('.cerrar') || movil.matches) return;
    var dx = e.clientX - v.offsetLeft, dy = e.clientY - v.offsetTop;
    t.setPointerCapture(e.pointerId);
    function mover(ev) {
      v.style.left = Math.max(-v.offsetWidth + 80, Math.min(innerWidth - 80, ev.clientX - dx)) + 'px';
      v.style.top = Math.max(0, Math.min(innerHeight - BARRA - 40, ev.clientY - dy)) + 'px';
    }
    function soltar() { t.removeEventListener('pointermove', mover); t.removeEventListener('pointerup', soltar); }
    t.addEventListener('pointermove', mover); t.addEventListener('pointerup', soltar);
  });

  function leer(f) { return fetch(f, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(f + ': ' + r.status); return r.json(); }); }
  Promise.all([leer('proyectos.json'), leer('logros.json')]).then(function (r) {
    d.perfil = r[0].perfil || {};
    d.certificaciones = r[0].certificaciones || [];
    d.proyectos = r[0].proyectos || [];
    d.logros = (r[1] || []).slice().sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
    pintarEscritorio();
    // Con un enlace a un proyecto se abre ése. Si no, la página de entrada es el Léeme, sola
    // y centrada; en el móvil ocupa la pantalla, y al cerrarla quedan los iconos.
    var m = /^#\/(.+)$/.exec(location.hash), pedido = m && decodeURIComponent(m[1]);
    if (pedido && proyecto(pedido)) abrir(pedido);
    else abrir('leeme', Math.max(140, Math.round((innerWidth - Math.min(640, innerWidth - 160)) / 2)), 40);
  }).catch(function (err) {
    // Abierta con doble clic (file://), el navegador no deja leer los JSON de al lado.
    document.getElementById('pista').textContent = location.protocol === 'file:'
      ? 'Abierta como fichero, el navegador no deja leer los proyectos. Para verla en este ordenador, sírvela con: node herramientas/logro.js ver'
      : 'No se pudieron leer los proyectos (' + err.message + '). Recarga la página.';
  });
})();
</script>
</body>
</html>
