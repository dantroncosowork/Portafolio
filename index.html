<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio de Daniel</title>
<meta name="description" content="Proyectos, automatizaciones y flujos de trabajo construidos con IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #08080A;
    --tarjeta: #131315;
    --elevada: #1A1A1D;
    --borde: #26262B;
    --texto: #F2F2F3;
    --texto-2: #B4BAC1;
    --texto-3: #8E949C;
    --acento: #A594FF;
    --app: #6CB4FF;
    --juego: #FF8FC7;
    --automatizacion: #F5B94A;
    --flujo: #5FD39A;
    --radio: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 400 16px/1.5 Inter, system-ui, sans-serif;
  }
  a { color: var(--acento); }
  button { font: inherit; color: inherit; }
  .pagina { max-width: 1120px; margin: 0 auto; padding: 48px 16px 64px; }
  [hidden] { display: none !important; }

  /* Arriba: quién es */
  .portada-sitio {
    background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--acento) 16%, transparent), transparent 60%), var(--tarjeta);
    border: 1px solid var(--borde); border-radius: 16px; padding: 32px;
  }
  .sello { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento); margin: 0 0 12px; }
  .portada-sitio h1 { font-size: 40px; line-height: 1.15; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
  .rol { font-size: 20px; color: var(--texto-2); margin: 0; max-width: 720px; }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
  .tres div { border-top: 1px solid var(--borde); padding-top: 12px; }
  .tres h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; color: var(--texto); }
  .tres p { font-size: 14px; color: var(--texto-2); margin: 0; }
  .bajo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; margin-top: 28px; }
  .cifras { display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--texto-3); font-size: 14px; }
  .cifras b { color: var(--texto); font-weight: 600; font-variant-numeric: tabular-nums; }
  .enlaces { display: flex; gap: 8px; flex-wrap: wrap; }
  .boton {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;
    color: var(--texto); background: var(--elevada); border: 1px solid var(--borde); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .boton:hover { border-color: var(--texto-3); }
  .boton.principal { color: var(--fondo); background: var(--acento); border-color: var(--acento); font-weight: 600; }

  h2.seccion { font-size: 20px; font-weight: 600; margin: 48px 0 16px; }
  .saltos { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }
  .grupo h3.titulo-grupo { font-size: 16px; font-weight: 600; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }
  .grupo h3.titulo-grupo::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .grupo h3 small { font-size: 14px; font-weight: 400; color: var(--texto-3); }

  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .proyecto {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio);
    overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0;
  }
  .proyecto:hover, .proyecto:focus-visible { border-color: var(--texto-3); outline: none; }
  .foto { aspect-ratio: 16 / 10; background: var(--elevada); position: relative; overflow: hidden; }
  .foto.sin { aspect-ratio: 16 / 5; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .foto .inicial {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 40px; font-weight: 600; color: var(--c); opacity: 0.55;
  }
  .cuerpo { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proyecto h4 { font-size: 16px; font-weight: 600; margin: 0; }
  .que { color: var(--texto-2); font-size: 14px; margin: 0; }
  .pie { margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--texto-3); }
  .chip { border: 1px solid var(--borde); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--texto-2); }
  .tipo { color: var(--c); border-color: color-mix(in srgb, var(--c) 40%, transparent); }
  .estado { font-size: 12px; color: var(--texto-3); white-space: nowrap; }
  .historia { font-size: 14px; color: var(--acento); }

  /* Los logros de la portada */
  .linea { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  .logro { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; }
  .meta { font-size: 12px; color: var(--texto-3); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .logro h4, .paso h4 { font-size: 16px; font-weight: 600; margin: 8px 0 4px; }
  .logro p, .paso p { color: var(--texto-2); margin: 0; white-space: pre-line; }
  .ir { display: inline-block; margin-top: 12px; font-size: 14px; background: none; border: 0; padding: 0; color: var(--acento); cursor: pointer; }
  .tiras { display: flex; gap: 8px; margin-top: 16px; overflow-x: auto; padding-bottom: 4px; }
  .tira { flex: 0 0 auto; border: 1px solid var(--borde); border-radius: 8px; padding: 0; background: var(--elevada); cursor: zoom-in; overflow: hidden; }
  /* Las capturas suelen ser de página entera: la miniatura enseña su parte de arriba. */
  .tira img { display: block; width: 240px; height: 150px; object-fit: cover; object-position: top left; }
  .tira.estrecha img { width: 96px; }
  .vacio { color: var(--texto-3); border: 1px dashed var(--borde); border-radius: var(--radio); padding: 32px; text-align: center; }

  /* La página de un proyecto */
  .volver { margin-bottom: 24px; }
  .cabeza { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start; }
  .cabeza .foto { border: 1px solid var(--borde); border-radius: var(--radio); }
  .cabeza h1 { font-size: 32px; font-weight: 600; margin: 8px 0; letter-spacing: -0.01em; }
  .cabeza .que { font-size: 16px; }
  .cabeza .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .camino { list-style: none; margin: 0; padding: 0; position: relative; }
  .camino::before { content: ''; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--borde); }
  .paso { position: relative; padding: 0 0 32px 52px; }
  .paso .num {
    position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 14px; font-weight: 600;
    background: var(--tarjeta); border: 2px solid var(--c); color: var(--texto);
  }
  .paso.menor .num { width: 14px; height: 14px; left: 9px; top: 6px; border-width: 2px; font-size: 0; }
  .paso.menor h4 { font-size: 14px; }
  .paso:last-child { padding-bottom: 0; }
  .paso .tarjeta-paso { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px 20px; }

  .tiras { scrollbar-color: var(--borde) transparent; scrollbar-width: thin; }

  /* El visor. Muchas capturas son de página entera (1440 × 3500): se abren al
     ancho de la pantalla y se bajan con la rueda; pulsando, a tamaño real. */
  dialog#visor {
    border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none;
    background: rgba(8, 8, 10, 0.96); color: var(--texto);
  }
  dialog#visor[open] { display: flex; flex-direction: column; }
  dialog#visor::backdrop { background: rgba(0, 0, 0, 0.6); }
  .barra-visor { display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--borde); }
  .barra-visor .titulo-visor { flex: 1; min-width: 0; font-size: 14px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lienzo { flex: 1; overflow: auto; padding: 16px; display: flex; justify-content: center; align-items: flex-start; }
  .lienzo img { display: block; max-width: 100%; height: auto; border-radius: 8px; cursor: zoom-in; }
  .lienzo.real { justify-content: flex-start; }
  .lienzo.real img { max-width: none; cursor: zoom-out; }

  footer { margin-top: 64px; color: var(--texto-3); font-size: 12px; }

  @media (max-width: 760px) {
    .tres { grid-template-columns: 1fr; }
    .cabeza { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .pagina { padding-top: 16px; }
    .portada-sitio { padding: 24px 20px; }
    .portada-sitio h1 { font-size: 32px; }
    .rol { font-size: 16px; }
    .rejilla { grid-template-columns: 1fr; }
    .tira img { width: 200px; height: 125px; }
    .tira.estrecha img { width: 80px; }
    .cabeza h1 { font-size: 26px; }
    .barra-visor .titulo-visor { flex-basis: 100%; }
    #visorAbrir { display: none; }
  }
</style>
</head>
<body>
<div class="pagina">
  <main id="inicio">
    <section class="portada-sitio">
      <p class="sello">Portafolio · proyectos hechos con IA</p>
      <h1 id="nombre">Portafolio</h1>
      <p class="rol" id="rol"></p>
      <div class="tres" id="tres"></div>
      <div class="bajo">
        <div class="cifras" id="cifras"></div>
        <div class="enlaces" id="enlaces"></div>
      </div>
    </section>

    <div class="saltos" id="saltos" role="group" aria-label="Ir a una categoría"></div>

    <h2 class="seccion">Proyectos</h2>
    <div id="grupos"></div>

    <h2 class="seccion">Últimos avances</h2>
    <ol class="linea" id="ultimos"></ol>
  </main>

  <main id="ficha" hidden></main>

  <footer>Esta página se mantiene sola: cada avance lo apunta el flujo del propio portafolio, con su captura, y se publica al subirlo.</footer>
</div>

<dialog id="visor" aria-label="Captura">
  <div class="barra-visor">
    <span class="titulo-visor" id="visorTitulo"></span>
    <button class="boton" type="button" id="visorAnt" aria-label="Captura anterior">←</button>
    <button class="boton" type="button" id="visorSig" aria-label="Captura siguiente">→</button>
    <button class="boton" type="button" id="visorZoom">Tamaño real</button>
    <a class="boton" id="visorAbrir" target="_blank" rel="noopener">Abrir aparte</a>
    <button class="boton" type="button" id="cerrarVisor">Cerrar</button>
  </div>
  <div class="lienzo" id="visorLienzo"><img id="visorImg" alt=""></div>
</dialog>

<script>
(function () {
  var TIPOS = { app: 'Apps', juego: 'Juegos', automatizacion: 'Automatizaciones', flujo: 'Flujos de trabajo' };
  var TIPO_UNO = { app: 'App', juego: 'Juego', automatizacion: 'Automatización', flujo: 'Flujo de trabajo' };
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var ULTIMOS = 6;
  var datos = { perfil: {}, proyectos: [], logros: [] };
  var verTodos = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fecha(iso) {
    var p = String(iso).split('-');
    return p.length === 3 ? (+p[2]) + ' ' + MESES[+p[1] - 1] + ' ' + p[0] : esc(iso);
  }
  function color(tipo) { return 'var(--' + (TIPOS[tipo] ? tipo : 'app') + ')'; }
  function proyecto(id) { return datos.proyectos.filter(function (p) { return p.id === id; })[0]; }
  // De más nuevo a más viejo; la página de un proyecto le da la vuelta.
  function logrosDe(id) { return datos.logros.filter(function (l) { return l.proyecto === id; }); }
  // Si un proyecto no marcó ningún hito, su historia son todos sus logros: nunca sale vacía.
  function hitosDe(id) {
    var ls = logrosDe(id), h = ls.filter(function (l) { return l.hito; });
    return h.length ? h : ls;
  }
  function fotoDe(id) {
    var ls = hitosDe(id).concat(logrosDe(id));
    for (var i = 0; i < ls.length; i++) {
      var cs = ls[i].capturas || [];
      var ancha = cs.filter(function (c) { return /1440/.test(c); })[0] || cs[0];
      if (ancha) return ancha;
    }
    return null;
  }
  function chipsIA(lista) { return (lista || []).map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join(''); }
  function tiras(l) {
    return (l.capturas || []).map(function (c) {
      return '<button class="tira' + (/-390[.-]/.test(c) ? ' estrecha' : '') + '" type="button" data-ver="' + esc(c) + '">' +
        '<img src="' + esc(c) + '" alt="Captura: ' + esc(l.titulo) + '" loading="lazy"></button>';
    }).join('');
  }
  function foto(p, img) {
    return '<div class="foto' + (img ? '' : ' sin') + '" style="--c:' + color(p.tipo) + '">' + (img
      ? '<img src="' + esc(img) + '" alt="Captura de ' + esc(p.nombre) + '" loading="lazy">'
      : '<div class="inicial" aria-hidden="true">' + esc(p.nombre.charAt(0)) + '</div>') + '</div>';
  }

  /* ---------- la portada ---------- */
  function pintarInicio() {
    var perfil = datos.perfil || {};
    document.getElementById('nombre').textContent = perfil.nombre || 'Portafolio';
    document.getElementById('rol').textContent = perfil.rol || '';
    var tres = [['Quién soy', perfil.quien], ['Por qué lo hago', perfil.porque], ['Qué busco', perfil.busca]]
      .filter(function (x) { return x[1]; });
    document.getElementById('tres').innerHTML = tres.map(function (x) {
      return '<div><h2>' + x[0] + '</h2><p>' + esc(x[1]) + '</p></div>';
    }).join('');
    var ultimo = datos.logros[0];
    document.getElementById('cifras').innerHTML =
      '<span><b>' + datos.proyectos.length + '</b> proyectos</span>' +
      '<span><b>' + datos.logros.length + '</b> avances apuntados</span>' +
      (ultimo ? '<span>el último, el <b>' + fecha(ultimo.fecha) + '</b></span>' : '');
    document.getElementById('enlaces').innerHTML = (perfil.enlaces || []).map(function (e) {
      return '<a class="boton" href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.nombre) + '</a>';
    }).join('');

    var orden = Object.keys(TIPOS).filter(function (t) { return datos.proyectos.some(function (p) { return p.tipo === t; }); });
    document.getElementById('saltos').innerHTML = orden.map(function (t) {
      return '<button class="boton" type="button" data-salto="' + t + '">' + TIPOS[t] + '</button>';
    }).join('');
    document.getElementById('grupos').innerHTML = orden.map(function (t) {
      var lista = datos.proyectos.filter(function (p) { return p.tipo === t; });
      return '<section class="grupo" id="grupo-' + t + '" style="--c:' + color(t) + '">' +
        '<h3 class="titulo-grupo">' + TIPOS[t] + ' <small>' + lista.length + '</small></h3>' +
        '<div class="rejilla">' + lista.map(tarjeta).join('') + '</div></section>';
    }).join('');

    var ultimos = datos.logros.slice(0, ULTIMOS);
    document.getElementById('ultimos').innerHTML = ultimos.length ? ultimos.map(function (l) {
      var pr = proyecto(l.proyecto) || { id: l.proyecto, nombre: l.proyecto, tipo: 'app' };
      return '<li class="logro" style="--c:' + color(pr.tipo) + '">' +
        '<div class="meta"><span>' + fecha(l.fecha) + '</span><span class="chip tipo">' + esc(pr.nombre) + '</span>' + chipsIA(l.ia) + '</div>' +
        '<h4>' + esc(l.titulo) + '</h4>' + (l.texto ? '<p>' + esc(l.texto) + '</p>' : '') +
        (l.capturas && l.capturas.length ? '<div class="tiras">' + tiras(l) + '</div>' : '') +
        '<button class="ir" type="button" data-proyecto="' + esc(pr.id) + '">Ver la historia de ' + esc(pr.nombre) + ' →</button>' +
        '</li>';
    }).join('') : '<li class="vacio">Todavía no hay avances apuntados.</li>';
  }

  function tarjeta(p) {
    var n = hitosDe(p.id).length;
    return '<button class="proyecto" type="button" data-proyecto="' + esc(p.id) + '" style="--c:' + color(p.tipo) + '">' +
      foto(p, fotoDe(p.id)) +
      '<div class="cuerpo">' +
        '<div class="fila"><h4>' + esc(p.nombre) + '</h4><span class="estado">' + esc(p.estado || '') + '</span></div>' +
        '<p class="que">' + esc(p.que || '') + '</p>' +
        '<div class="pie"><span class="chip tipo">' + (TIPO_UNO[p.tipo] || esc(p.tipo)) + '</span>' + chipsIA(p.ia) + '</div>' +
        '<span class="historia">' + (n ? 'Su historia: ' + n + (n === 1 ? ' paso' : ' pasos') + ' →' : 'Ver el proyecto →') + '</span>' +
      '</div></button>';
  }

  /* ---------- la página de un proyecto ---------- */
  function pintarFicha(id) {
    var p = proyecto(id);
    var caja = document.getElementById('ficha');
    if (!p) { location.hash = ''; return; }
    var hitos = hitosDe(id).slice().reverse();
    var todos = logrosDe(id).slice().reverse();
    var menores = todos.length - hitos.length;
    var lista = verTodos ? todos : hitos;
    document.title = p.nombre + ' · ' + ((datos.perfil && datos.perfil.nombre) || 'Portafolio');

    var pasos = lista.length ? lista.map(function (l) {
      var esHito = hitos.indexOf(l) >= 0;
      var num = esHito ? hitos.indexOf(l) + 1 : '';
      return '<li class="paso' + (esHito ? '' : ' menor') + '" style="--c:' + color(p.tipo) + '">' +
        '<span class="num" aria-hidden="true">' + num + '</span>' +
        '<div class="tarjeta-paso">' +
          '<div class="meta"><span>' + fecha(l.fecha) + '</span>' + (l.etapa ? '<span class="chip tipo">' + esc(l.etapa) + '</span>' : '') + chipsIA(l.ia) + '</div>' +
          '<h4>' + esc(l.titulo) + '</h4>' + (l.texto ? '<p>' + esc(l.texto) + '</p>' : '') +
          (l.capturas && l.capturas.length ? '<div class="tiras">' + tiras(l) + '</div>' : '') +
        '</div></li>';
    }).join('') : '';

    caja.innerHTML =
      '<button class="boton volver" type="button" data-volver>← Todos los proyectos</button>' +
      '<div class="cabeza" style="--c:' + color(p.tipo) + '">' +
        '<div>' +
          '<div class="meta"><span class="chip tipo">' + (TIPO_UNO[p.tipo] || esc(p.tipo)) + '</span>' + chipsIA(p.ia) + '<span>' + esc(p.estado || '') + '</span></div>' +
          '<h1>' + esc(p.nombre) + '</h1>' +
          '<p class="que">' + esc(p.que || '') + '</p>' +
          (p.historia ? '<p class="que" style="margin-top:12px">' + esc(p.historia) + '</p>' : '') +
          '<div class="acciones">' +
            (p.url ? '<a class="boton principal" href="' + esc(p.url) + '" target="_blank" rel="noopener">Verlo en vivo →</a>' : '') +
            (p.repo ? '<a class="boton" href="' + esc(p.repo) + '" target="_blank" rel="noopener">El código</a>' : '') +
          '</div>' +
        '</div>' +
        foto(p, fotoDe(id)) +
      '</div>' +
      '<h2 class="seccion">Su historia, paso a paso</h2>' +
      (pasos ? '<ol class="camino">' + pasos + '</ol>' : '<p class="vacio">Este proyecto todavía no tiene avances apuntados. El primero saldrá aquí.</p>') +
      (menores > 0 ? '<button class="boton" type="button" data-todos style="margin-top:24px">' +
        (verTodos ? 'Ver sólo los pasos grandes' : menores === 1 ? 'Ver también el avance pequeño' : 'Ver también los ' + menores + ' avances pequeños') + '</button>' : '');
  }

  /* ---------- las rutas: #/<proyecto> es la página de ese proyecto, y se puede compartir ---------- */
  var fichaAbierta = null;
  function ruta() {
    var m = /^#\/(.+)$/.exec(location.hash);
    var id = m && decodeURIComponent(m[1]);
    // Cada proyecto se abre con sus pasos grandes, llegue uno por la tarjeta, por un enlace o con «atrás».
    if (id !== fichaAbierta) { verTodos = false; fichaAbierta = id; }
    document.getElementById('inicio').hidden = !!id;
    document.getElementById('ficha').hidden = !id;
    if (id) { pintarFicha(id); window.scrollTo(0, 0); }
    else { document.title = 'Portafolio de ' + ((datos.perfil && datos.perfil.nombre) || 'Daniel'); }
  }

  document.addEventListener('click', function (e) {
    var v = e.target.closest('[data-ver]');
    if (v) {
      // Las flechas recorren las capturas del mismo avance.
      var hermanas = [].slice.call(v.parentNode.querySelectorAll('[data-ver]'));
      visor.lista = hermanas.map(function (b) { return { src: b.getAttribute('data-ver'), alt: b.querySelector('img').alt }; });
      mostrar(hermanas.indexOf(v));
      document.getElementById('visor').showModal();
      return;
    }
    var s = e.target.closest('[data-salto]');
    if (s) { document.getElementById('grupo-' + s.getAttribute('data-salto')).scrollIntoView({ behavior: 'smooth' }); return; }
    if (e.target.closest('[data-volver]')) { location.hash = ''; return; }
    if (e.target.closest('[data-todos]')) {
      verTodos = !verTodos;
      pintarFicha(decodeURIComponent(location.hash.slice(2)));
      return;
    }
    var p = e.target.closest('[data-proyecto]');
    if (p) { location.hash = '#/' + encodeURIComponent(p.getAttribute('data-proyecto')); }
  });
  window.addEventListener('hashchange', ruta);
  /* ---------- el visor ---------- */
  var visor = { lista: [], i: 0 };
  function mostrar(i) {
    var n = visor.lista.length;
    visor.i = (i + n) % n;
    var c = visor.lista[visor.i];
    var img = document.getElementById('visorImg');
    img.src = c.src; img.alt = c.alt;
    document.getElementById('visorTitulo').textContent = c.alt.replace(/^Captura: /, '') + (n > 1 ? ' · ' + (visor.i + 1) + ' de ' + n : '');
    document.getElementById('visorAbrir').href = c.src;
    document.getElementById('visorAnt').hidden = document.getElementById('visorSig').hidden = n < 2;
    zoom(false);
  }
  function zoom(real) {
    var l = document.getElementById('visorLienzo');
    l.classList.toggle('real', real);
    l.scrollTop = 0; l.scrollLeft = 0;
    document.getElementById('visorZoom').textContent = real ? 'Ajustar a la pantalla' : 'Tamaño real';
  }
  function enReal() { return document.getElementById('visorLienzo').classList.contains('real'); }
  document.getElementById('visorImg').addEventListener('click', function () { zoom(!enReal()); });
  document.getElementById('visorZoom').addEventListener('click', function () { zoom(!enReal()); });
  document.getElementById('visorAnt').addEventListener('click', function () { mostrar(visor.i - 1); });
  document.getElementById('visorSig').addEventListener('click', function () { mostrar(visor.i + 1); });
  document.getElementById('cerrarVisor').addEventListener('click', function () { document.getElementById('visor').close(); });
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('visor').open || visor.lista.length < 2) return;
    if (e.key === 'ArrowLeft') mostrar(visor.i - 1);
    if (e.key === 'ArrowRight') mostrar(visor.i + 1);
  });

  function leer(f) {
    return fetch(f, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(f + ': ' + r.status);
      return r.json();
    });
  }
  Promise.all([leer('proyectos.json'), leer('logros.json')]).then(function (r) {
    datos.perfil = r[0].perfil || {};
    datos.proyectos = r[0].proyectos || [];
    datos.logros = (r[1] || []).slice().sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
    pintarInicio();
    ruta();
  }).catch(function (err) {
    document.getElementById('ultimos').innerHTML = '<li class="vacio">No se pudieron leer los datos (' + esc(err.message) + ').</li>';
  });
})();
</script>
</body>
</html>
