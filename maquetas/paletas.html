<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel OS: probar paletas</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 400 15px/1.4 system-ui, sans-serif; background: #111; color: #fff; }
  body { display: grid; grid-template-rows: auto 1fr; }
  .elegir { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 10px; }
  .elegir button { display: flex; align-items: center; gap: 8px; font: inherit; color: #fff; background: #222; border: 2px solid #444; padding: 4px 10px 4px 6px; cursor: pointer; }
  .elegir button[aria-pressed="true"] { border-color: #fff; background: #333; }
  .elegir i { display: inline-flex; border: 1px solid #000; }
  .elegir i span { width: 14px; height: 18px; }
  .elegir p { margin: 0 0 0 8px; color: #bbb; flex: 1 1 300px; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="elegir" id="elegir"></div>
<iframe id="marco" src="../index.html" title="Daniel OS con la paleta elegida"></iframe>
<script src="paletas.js"></script>
<script>
  // Mueve el ratón por el escritorio para ver la malla con cada paleta.
  var marco = document.getElementById('marco'), elegir = document.getElementById('elegir'), actual = 0;
  elegir.innerHTML = PALETAS.map(function (p, i) {
    return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '"><i aria-hidden="true">' +
      ['mesa', 'papel', 'activa'].map(function (k) { return '<span style="background:' + p.v[k] + '"></span>'; }).join('') +
      '</i>' + p.nombre + '</button>';
  }).join('') + '<p id="por"></p>';
  function poner(i) {
    actual = i;
    var doc = marco.contentDocument; if (!doc) return;
    var s = doc.getElementById('paleta') || doc.head.appendChild(doc.createElement('style'));
    s.id = 'paleta'; s.textContent = cssPaleta(PALETAS[i]);
    marco.contentWindow.dispatchEvent(new Event('resize')); // la malla vuelve a leer su color
    elegir.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.i === i)); });
    document.getElementById('por').textContent = PALETAS[i].por;
  }
  elegir.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) poner(+b.dataset.i); });
  marco.addEventListener('load', function () { poner(actual); });
</script>
</body>
</html>
