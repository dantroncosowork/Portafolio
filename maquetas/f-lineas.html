<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta F · Mapa de líneas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* Un plano de transporte: cada proyecto es una línea que avanza por el mes,
     cada avance una estación, y los hitos son las estaciones grandes. */
  :root {
    --blanco: #FFFFFF;
    --tinta: #1A1A1A;
    --gris: #5F6368;
    --via: #E3E3E3;         /* la rejilla de días, casi invisible */
    --senal: #FFD100;       /* el amarillo de la señal de «hoy» */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--blanco); color: var(--tinta); font: 400 17px/1.55 Overpass, 'Segoe UI', sans-serif; }
  .pagina { max-width: 1280px; margin: 0 auto; padding: 48px 24px 80px; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  a { color: var(--tinta); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  .cabecera { display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; align-items: end; }
  h1 { font: 800 76px/0.95 Overpass, sans-serif; letter-spacing: -0.02em; margin: 0 0 16px; }
  .rol { font-size: 22px; line-height: 1.4; margin: 0; max-width: 32ch; }
  .yo { display: flex; gap: 16px; align-items: flex-start; }
  .yo img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 3px solid var(--tinta); }
  .tres p { margin: 0 0 10px; font-size: 15px; color: var(--gris); max-width: 52ch; }
  .tres b { color: var(--tinta); }

  .resumen { margin: 48px 0 12px; font-size: 18px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--gris); margin-bottom: 8px; align-items: center; }
  .leyenda svg { vertical-align: middle; margin-right: 6px; }

  .plano { overflow-x: auto; border-top: 4px solid var(--tinta); border-bottom: 1px solid var(--via); padding: 8px 0 4px; }
  .plano svg { display: block; min-width: 960px; width: 100%; height: auto; }
  .estacion { cursor: pointer; }
  .estacion:focus { outline: none; }
  .estacion:focus-visible .aro, .estacion:hover .aro { stroke-width: 5; }
  .estacion.activa .aro { fill: var(--senal); }

  .ficha { display: grid; grid-template-columns: 1fr 1.25fr; gap: 40px; margin-top: 32px; align-items: start; }
  .ficha > *, .cabecera > * { min-width: 0; } /* que la tira de capturas no ensanche la columna */
  .ficha .linea-de { display: inline-flex; align-items: center; gap: 10px; font: 700 15px Overpass, sans-serif; }
  .chapa { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; font: 800 14px Overpass, sans-serif; }
  .ficha h2 { font: 800 34px/1.12 Overpass, sans-serif; margin: 14px 0 10px; letter-spacing: -0.01em; }
  .ficha .cuando { color: var(--gris); font-size: 15px; margin-bottom: 14px; }
  .ficha p { margin: 0 0 20px; max-width: 60ch; }
  .ficha .botones { display: flex; gap: 10px; flex-wrap: wrap; }
  .ficha button { font: 700 15px Overpass, sans-serif; background: var(--blanco); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 22px; padding: 8px 18px; cursor: pointer; }
  .ficha button:disabled { opacity: 0.35; cursor: default; }
  .ficha figure { margin: 0; }
  .ficha figure img { width: 100%; display: block; border: 1px solid var(--via); border-radius: 6px; max-height: 520px; object-fit: cover; object-position: top left; }
  .ficha .tiras { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
  .ficha .tiras button { padding: 0; border: 2px solid transparent; border-radius: 4px; background: none; }
  .ficha .tiras button[aria-current="true"] { border-color: var(--tinta); }
  .ficha .tiras img { display: block; width: 84px; height: 54px; object-fit: cover; object-position: top left; border-radius: 2px; }

  h3.titulo { font: 800 34px/1.1 Overpass, sans-serif; margin: 80px 0 24px; }
  .lineas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px 40px; }
  .lineas li { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .lineas .chapa { grid-row: span 2; margin-top: 2px; }
  .lineas b { font-size: 19px; }
  .lineas .que { color: var(--gris); font-size: 15px; grid-column: 2; }
  .lineas a { grid-column: 2; font-size: 15px; justify-self: start; }

  .certs { display: flex; flex-wrap: wrap; gap: 20px 40px; }
  .cert { display: flex; gap: 14px; align-items: center; text-decoration: none; }
  .cert img { width: 52px; height: 52px; object-fit: contain; }
  .cert b { display: block; }
  .cert span { color: var(--gris); font-size: 14px; }

  @media (max-width: 860px) {
    .cabecera { grid-template-columns: 1fr; gap: 28px; }
    h1 { font-size: 52px; }
    .rol { font-size: 19px; }
    .ficha { grid-template-columns: 1fr; gap: 20px; }
    .ficha figure { order: -1; }
    .ficha h2 { font-size: 26px; }
    h3.titulo { font-size: 28px; margin-top: 56px; }
    .lineas { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header class="cabecera">
    <div>
      <h1 id="nombre"></h1>
      <p class="rol" id="rol"></p>
    </div>
    <div class="yo"><img id="foto" alt=""><div class="tres" id="tres"></div></div>
  </header>

  <p class="resumen" id="resumen"></p>
  <div class="leyenda">
    <span><svg width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="#fff" stroke="#1A1A1A" stroke-width="3"/></svg>Hito: algo que se nota desde fuera</span>
    <span><svg width="22" height="22" aria-hidden="true"><line x1="0" y1="11" x2="22" y2="11" stroke="#8C8C8C" stroke-width="6"/><rect x="8.5" y="2" width="5" height="18" fill="#fff" stroke="#1A1A1A" stroke-width="2"/></svg>Avance pequeño</span>
    <span><svg width="40" height="22" aria-hidden="true"><line x1="2" y1="11" x2="38" y2="11" stroke="#1A1A1A" stroke-width="5" stroke-dasharray="6 5"/></svg>Sigue en marcha</span>
    <span>Pulsa una estación para verla.</span>
  </div>
  <div class="plano" id="plano"></div>

  <section class="ficha" id="ficha" aria-live="polite"></section>

  <h3 class="titulo">Las líneas</h3>
  <ul class="lineas" id="lineas"></ul>

  <h3 class="titulo">Certificados</h3>
  <div class="certs" id="certs"></div>
</div>

<script src="datos.js"></script>
<script>
Portafolio.cargar().then(function (d) {
  var P = Portafolio, esc = P.esc;
  // Colores de línea: distintos entre sí y reconocibles, como los de un plano de metro.
  var COLORES = ['#00843D', '#0072CE', '#E4002B', '#F2A900', '#8C4799', '#00A3AD', '#EE7623', '#6D6E71', '#A6192E'];
  function claro(hex) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
  }

  if (d.foto) document.getElementById('foto').src = d.foto;
  document.getElementById('nombre').textContent = d.perfil.nombre || '';
  document.getElementById('rol').textContent = d.perfil.rol || '';
  document.getElementById('tres').innerHTML =
    '<p><b>Quién soy.</b> ' + esc(d.perfil.quien) + '</p><p><b>Por qué.</b> ' + esc(d.perfil.porque) + '</p><p><b>Qué busco.</b> ' + esc(d.perfil.busca) + '</p>';

  // Las líneas, de la que tiene más estaciones a la que menos.
  var lineas = d.proyectos.slice().sort(function (a, b) { return d.logrosDe(b.id).length - d.logrosDe(a.id).length; });
  lineas.forEach(function (p, i) { p.color = COLORES[i % COLORES.length]; p.texto = claro(p.color) ? '#1A1A1A' : '#FFFFFF'; p.corto = p.nombre.replace('Este portafolio', 'Portafolio'); });

  var dia = function (iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; };
  var fechas = d.logros.map(function (l) { return dia(l.fecha); });
  var hoy = new Date(), dHoy = Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) / 864e5;
  var d0 = Math.min.apply(null, fechas) - 1, d1 = Math.max(Math.max.apply(null, fechas), dHoy) + 1;
  var con = lineas.filter(function (p) { return d.logrosDe(p.id).length; }).length;
  document.getElementById('resumen').innerHTML = '<b>' + con + ' líneas en servicio y ' + d.logros.length + ' estaciones</b>, del ' +
    P.fecha(d.logros[d.logros.length - 1].fecha) + ' al ' + P.fecha(d.logros[0].fecha) + '. El último avance es la estación amarilla.';

  // El plano.
  var IZQ = 190, DER = 30, W = 1240, FILA = 52, ARRIBA = 40;
  var H = ARRIBA + lineas.length * FILA + 40;
  var x = function (dd) { return IZQ + (dd - d0) / (d1 - d0) * (W - IZQ - DER); };
  var s = '';
  // Rejilla de semanas y la señal de hoy.
  for (var dd = Math.ceil(d0); dd <= d1; dd++) {
    var f = new Date(dd * 864e5);
    if (f.getUTCDay() === 1) {
      s += '<line x1="' + x(dd) + '" y1="' + (ARRIBA - 14) + '" x2="' + x(dd) + '" y2="' + (H - 30) + '" stroke="var(--via)" stroke-width="1"/>' +
        '<text x="' + x(dd) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="13" fill="#5F6368">' + f.getUTCDate() + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][f.getUTCMonth()] + '</text>';
    }
  }
  s += '<line x1="' + x(dHoy) + '" y1="' + (ARRIBA - 22) + '" x2="' + x(dHoy) + '" y2="' + (H - 30) + '" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="2 4"/>' +
    '<text x="' + x(dHoy) + '" y="' + (ARRIBA - 28) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">hoy</text>';

  var estaciones = [];
  lineas.forEach(function (p, i) {
    var y = ARRIBA + i * FILA + 16;
    var ls = d.logrosDe(p.id).slice().reverse();
    s += '<g><rect x="8" y="' + (y - 14) + '" width="' + (IZQ - 28) + '" height="28" rx="14" fill="' + p.color + '"/>' +
      '<text x="22" y="' + (y + 5) + '" font-size="14" font-weight="800" fill="' + p.texto + '">' + esc(p.corto) + '</text></g>';
    if (!ls.length) {
      s += '<text x="' + (IZQ + 4) + '" y="' + (y + 5) + '" font-size="14" fill="#5F6368">En obras: todavía sin estaciones</text>';
      return;
    }
    // Varios avances el mismo día son una sola estación, más ancha: si se separaran, se pisarían al pulsar.
    var grupos = [];
    ls.forEach(function (l) { var g = grupos[grupos.length - 1]; if (g && g.fecha === l.fecha) g.ls.push(l); else grupos.push({ fecha: l.fecha, ls: [l] }); });
    var ultimoG = grupos[grupos.length - 1];
    var x0 = x(dia(grupos[0].fecha)) - 10, x1 = x(dia(ultimoG.fecha)) + (ultimoG.ls.length - 1) * 10 + 10;
    s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="' + p.color + '" stroke-width="8" stroke-linecap="round"/>';
    if (p.estado !== 'terminado') s += '<line x1="' + x1 + '" y1="' + y + '" x2="' + x(dHoy) + '" y2="' + y + '" stroke="' + p.color + '" stroke-width="8" stroke-dasharray="8 7"/>';
    grupos.forEach(function (g) {
      var n = estaciones.length, cx = x(dia(g.fecha)), extra = (g.ls.length - 1) * 10;
      g.ls.forEach(function (l) { estaciones.push({ l: l, p: p }); });
      var titulos = g.ls.map(function (l) { return l.titulo; });
      var forma = g.ls.length > 1
        ? '<rect class="aro" x="' + (cx - 9) + '" y="' + (y - 9) + '" width="' + (18 + extra) + '" height="18" rx="9" fill="#fff" stroke="#1A1A1A" stroke-width="3.5"/>'
        : g.ls[0].hito
          ? '<circle class="aro" cx="' + cx + '" cy="' + y + '" r="9" fill="#fff" stroke="#1A1A1A" stroke-width="3.5"/>'
          : '<rect class="aro" x="' + (cx - 2.5) + '" y="' + (y - 9) + '" width="5" height="18" fill="#fff" stroke="#1A1A1A" stroke-width="2"/>';
      s += '<g class="estacion" tabindex="0" role="button" data-n="' + n + '" data-hasta="' + (n + g.ls.length - 1) + '" aria-label="' + esc(p.nombre + ', ' + P.fecha(g.fecha) + ': ' + titulos.join('; ')) + '"><title>' + esc(titulos.join(' / ')) + '</title>' +
        forma + '<rect x="' + (cx - 13) + '" y="' + (y - 14) + '" width="' + (26 + extra) + '" height="28" fill="transparent"/></g>';
    });
  });
  var plano = document.getElementById('plano');
  plano.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Plano de los proyectos por fecha">' + s + '</svg>';
  plano.scrollLeft = plano.scrollWidth; // en pantallas estrechas, que se vea lo último primero

  // La ficha de la estación elegida, con sus vecinas en la misma línea.
  function ver(n) {
    var e = estaciones[n]; if (!e) return;
    document.querySelectorAll('.estacion').forEach(function (g) { g.classList.toggle('activa', n >= +g.dataset.n && n <= +g.dataset.hasta); });
    var misma = estaciones.map(function (x, i) { return { x: x, i: i }; }).filter(function (o) { return o.x.p.id === e.p.id; });
    var pos = misma.findIndex(function (o) { return o.i === n; });
    var imgs = d.imagenes(e.l);
    document.getElementById('ficha').innerHTML =
      '<div><span class="linea-de"><span class="chapa" style="background:' + e.p.color + ';color:' + e.p.texto + '">' + (pos + 1) + '</span>' +
        'Línea ' + esc(e.p.nombre) + ', estación ' + (pos + 1) + ' de ' + misma.length + '</span>' +
      '<h2>' + esc(e.l.titulo) + '</h2>' +
      '<div class="cuando">' + P.fecha(e.l.fecha) + (e.l.hito && e.l.etapa ? '. Hito: ' + esc(e.l.etapa.toLowerCase()) : '') + (e.l.ia && e.l.ia.length ? '. Hecho con ' + esc(e.l.ia.join(' y ')) : '') + '.</div>' +
      '<p>' + esc(e.l.texto) + '</p>' +
      '<div class="botones"><button type="button" data-ir="' + (pos > 0 ? misma[pos - 1].i : '') + '"' + (pos > 0 ? '' : ' disabled') + '>Estación anterior</button>' +
      '<button type="button" data-ir="' + (pos < misma.length - 1 ? misma[pos + 1].i : '') + '"' + (pos < misma.length - 1 ? '' : ' disabled') + '>Estación siguiente</button></div></div>' +
      '<figure>' + (imgs.length ? '<img id="fichaImg" src="' + esc(imgs[0]) + '" alt="Captura: ' + esc(e.l.titulo) + '">' +
        (imgs.length > 1 ? '<div class="tiras">' + imgs.map(function (src, i) { return '<button type="button" data-img="' + esc(src) + '" aria-current="' + (i === 0) + '" aria-label="Captura ' + (i + 1) + '"><img src="' + esc(src) + '" alt=""></button>'; }).join('') + '</div>' : '')
        : '') + '</figure>';
  }
  document.addEventListener('click', function (e) {
    var g = e.target.closest('.estacion'); if (g) { ver(+g.dataset.n); return; }
    var b = e.target.closest('[data-ir]'); if (b && b.dataset.ir !== '') { ver(+b.dataset.ir); return; }
    var t = e.target.closest('[data-img]');
    if (t) { document.getElementById('fichaImg').src = t.dataset.img; document.querySelectorAll('[data-img]').forEach(function (x) { x.setAttribute('aria-current', String(x === t)); }); }
  });
  document.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.estacion');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ver(+g.dataset.n); }
  });
  // Arranca en el último avance.
  var ultimo = estaciones.reduce(function (m, e, i) { return e.l.id === d.logros[0].id ? i : m; }, 0);
  ver(ultimo);

  document.getElementById('lineas').innerHTML = lineas.map(function (p) {
    var n = d.logrosDe(p.id).length;
    return '<li><span class="chapa" style="background:' + p.color + ';color:' + p.texto + '">' + n + '</span><b>' + esc(p.nombre) + '</b>' +
      '<span class="que">' + esc(p.que) + '</span>' + (p.url ? '<a href="' + esc(p.url) + '">Abrir ' + esc(p.nombre) + '</a>' : '') + '</li>';
  }).join('');
  document.getElementById('certs').innerHTML = d.certificaciones.map(function (k) {
    return '<a class="cert" href="' + esc(k.url) + '"><img src="' + esc(k.badge) + '" alt=""><div><b>' + esc(k.nombre) + '</b><span>' + esc(k.emisor) + ', ' + P.fecha(k.fecha) + '</span></div></a>';
  }).join('');
});
</script>
</body>
</html>
