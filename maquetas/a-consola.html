<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta A · Consola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #040914; --panel: rgba(10, 15, 30, 0.82); --linea: rgba(0, 240, 255, 0.18);
    --cian: #00F0FF; --cian-brillo: rgba(0, 240, 255, 0.4); --oro: #FFCF00;
    --texto: #E2E8F0; --texto-2: #94A3B8; --mono: 'Fira Code', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--texto); font: 400 16px/1.55 Inter, system-ui, sans-serif;
    background-color: var(--fondo);
    /* La placa de circuito, dibujada: sin imagen de fondo que cargar. */
    background-image:
      radial-gradient(circle at 15% 10%, rgba(0, 240, 255, 0.10), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255, 207, 0, 0.06), transparent 40%),
      linear-gradient(var(--linea) 1px, transparent 1px),
      linear-gradient(90deg, var(--linea) 1px, transparent 1px);
    background-size: auto, auto, 48px 48px, 48px 48px;
    background-attachment: fixed;
  }
  .pagina { max-width: 1080px; margin: 0 auto; padding: 40px 16px 64px; }
  .mono { font-family: var(--mono); }

  .marco { position: relative; padding: 2px; filter: drop-shadow(0 0 14px var(--cian-brillo));
    background: linear-gradient(135deg, rgba(0,240,255,.35), transparent 22%, transparent 78%, rgba(255,207,0,.35));
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
  .marco > .dentro { position: relative; background: var(--panel); backdrop-filter: blur(8px); padding: 40px;
    clip-path: polygon(19px 0, 100% 0, 100% calc(100% - 19px), calc(100% - 19px) 100%, 0 100%, 0 19px); overflow: hidden; }
  .esq { position: absolute; width: 14px; height: 14px; border: 0 solid var(--cian); pointer-events: none; }
  .esq.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; } .esq.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
  .esq.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; } .esq.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; border-color: var(--oro); }
  .barrido { position: absolute; left: 0; right: 0; height: 2px; background: var(--cian); opacity: .15; box-shadow: 0 0 10px var(--cian); animation: barrer 6s linear infinite; pointer-events: none; }
  @keyframes barrer { from { top: -2%; } to { top: 102%; } }

  .cabeza { display: flex; gap: 40px; align-items: center; padding-bottom: 32px; border-bottom: 1px solid rgba(0,240,255,.2); }
  .avatar { position: relative; width: 120px; height: 120px; flex-shrink: 0; margin: 20px; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #1A2B4C; position: relative; z-index: 1; }
  .anillo { position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed var(--cian); opacity: .7; animation: girar 15s linear infinite; }
  .anillo.dos { inset: -20px; border: 2px solid transparent; border-top-color: var(--oro); border-bottom-color: var(--cian); opacity: .5; animation-duration: 20s; animation-direction: reverse; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .rotulo { font-size: 12px; letter-spacing: .2em; color: var(--cian); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .rotulo i { width: 8px; height: 8px; border-radius: 50%; background: var(--cian); box-shadow: 0 0 8px var(--cian-brillo); }
  h1 { font-size: 44px; line-height: 1.1; margin: 8px 0 12px; font-weight: 700; color: #fff; }
  .rol { color: var(--texto-2); font-size: 18px; margin: 0; min-height: 2.6em; }
  .cursor::after { content: '█'; color: var(--cian); margin-left: 4px; animation: parpadeo 1s step-start infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }

  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 32px 0; }
  .tres div { background: rgba(4,9,20,.6); padding: 16px; border-left: 2px solid var(--cian); font-size: 14px; color: var(--texto-2); }
  .tres div:nth-child(2) { border-color: var(--oro); }
  .tres h2 { font-size: 16px; color: #fff; margin: 0 0 8px; font-weight: 600; }
  .tres h2 span { color: var(--cian); margin-right: 6px; } .tres div:nth-child(2) h2 span { color: var(--oro); }

  .cifras { display: flex; flex-wrap: wrap; gap: 16px 48px; align-items: end; padding: 16px 0; border-block: 1px solid rgba(0,240,255,.15); }
  .cifra b { display: block; font-family: var(--mono); font-size: 24px; color: var(--cian); text-shadow: 0 0 8px var(--cian-brillo); font-variant-numeric: tabular-nums; }
  .cifra:nth-child(2) b { color: var(--oro); text-shadow: 0 0 6px rgba(255,207,0,.45); }
  .cifra > span { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--texto-2); }
  .estado { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--cian); }

  .botones { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .boton { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--texto); text-decoration: none;
    background: rgba(0,240,255,.05); border: 1px solid rgba(0,240,255,.3); padding: 8px 14px; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .boton:hover { background: rgba(0,240,255,.15); border-color: var(--cian); }
  .boton b { color: var(--cian); font-weight: 400; } .boton.gh { margin-left: auto; color: var(--cian); border-color: var(--cian); }

  h3.seccion { font: 600 13px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--cian); margin: 56px 0 16px; }
  h3.seccion::before { content: '// '; color: var(--oro); }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .tarjeta { background: var(--panel); border: 1px solid rgba(0,240,255,.2); position: relative;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  .tarjeta .img { aspect-ratio: 16 / 9; background: #0A1328; overflow: hidden; border-bottom: 1px solid rgba(0,240,255,.2); }
  .tarjeta .img img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; filter: saturate(.85); }
  .tarjeta .img .letra { height: 100%; display: grid; place-items: center; font: 600 40px var(--mono); color: var(--cian); opacity: .5; }
  .tarjeta .txt { padding: 16px; }
  .tarjeta h4 { margin: 0 0 6px; font-size: 18px; color: #fff; }
  .tarjeta p { margin: 0 0 12px; font-size: 14px; color: var(--texto-2); }
  .tarjeta .pie { font: 12px var(--mono); color: var(--texto-2); display: flex; flex-wrap: wrap; gap: 8px; }
  .tarjeta .pie .tipo { color: var(--oro); } .tarjeta .pie a { color: var(--cian); margin-left: auto; text-decoration: none; }

  .log { list-style: none; margin: 0; padding: 0; border-left: 1px solid rgba(0,240,255,.3); }
  .log li { padding: 0 0 28px 24px; position: relative; }
  .log li::before { content: ''; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; background: var(--cian); box-shadow: 0 0 8px var(--cian); }
  .log .meta { font: 12px var(--mono); color: var(--texto-2); }
  .log .meta b { color: var(--oro); font-weight: 400; }
  .log h4 { margin: 4px 0 6px; font-size: 18px; color: #fff; }
  .log p { margin: 0 0 12px; color: var(--texto-2); font-size: 14px; max-width: 760px; }
  .tiras { display: flex; gap: 8px; overflow-x: auto; }
  .tiras img { width: 220px; height: 130px; object-fit: cover; object-position: top left; border: 1px solid rgba(0,240,255,.25); }

  @media (max-width: 720px) {
    .marco > .dentro { padding: 28px 20px; }
    .cabeza { flex-direction: column; text-align: center; gap: 12px; }
    .rotulo { justify-content: center; } h1 { font-size: 34px; }
    .tres { grid-template-columns: 1fr; } .estado { margin-left: 0; } .boton.gh { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .anillo, .barrido, .cursor::after { animation: none; } .barrido { display: none; } }
</style>
</head>
<body>
<div class="pagina">
  <div class="marco"><div class="dentro">
    <span class="esq tl"></span><span class="esq tr"></span><span class="esq bl"></span><span class="esq br"></span><span class="barrido"></span>
    <div class="cabeza">
      <div class="avatar"><span class="anillo"></span><span class="anillo dos"></span><img id="foto" alt=""></div>
      <div>
        <div class="rotulo mono"><i></i>Portafolio · proyectos hechos con IA</div>
        <h1 id="nombre"></h1>
        <p class="rol" id="rol"></p>
      </div>
    </div>
    <div class="tres" id="tres"></div>
    <div class="cifras" id="cifras"></div>
    <div class="botones" id="botones"></div>
  </div></div>

  <h3 class="seccion">Proyectos</h3>
  <div class="rejilla" id="proyectos"></div>

  <h3 class="seccion">Registro de avances</h3>
  <ol class="log" id="log"></ol>
</div>
<script src="datos.js"></script>
<script>
Portafolio.cargar().then(function (d) {
  var P = Portafolio, esc = P.esc, quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (d.foto) document.getElementById('foto').src = d.foto;
  document.getElementById('nombre').textContent = d.perfil.nombre || '';

  // El rol se escribe letra a letra, pero el texto entero está para quien no ve la animación.
  var rol = document.getElementById('rol'), texto = d.perfil.rol || '';
  rol.setAttribute('aria-label', texto);
  if (quieto) rol.textContent = texto;
  else { rol.classList.add('cursor'); var i = 0; (function teclear() { if (i <= texto.length) { rol.textContent = texto.slice(0, i++); setTimeout(teclear, 30); } })(); }

  document.getElementById('tres').innerHTML = [['Quién soy', d.perfil.quien], ['Por qué lo hago', d.perfil.porque], ['Qué busco', d.perfil.busca]]
    .map(function (x) { return '<div><h2><span>&gt;</span>' + x[0] + '</h2>' + esc(x[1]) + '</div>'; }).join('');

  var c = d.cifras;
  document.getElementById('cifras').innerHTML =
    [[c.proyectos, 'Proyectos'], [c.certificaciones, 'Certificaciones'], [c.avances, 'Avances apuntados']].map(function (x) {
      return '<div class="cifra"><b>[ <span data-n="' + x[0] + '">' + x[0] + '</span> ]</b><span>' + x[1] + '</span></div>';
    }).join('') + (c.ultimo ? '<span class="estado">ÚLTIMO AVANCE: ' + P.fecha(c.ultimo).toUpperCase() + '</span>' : '');
  if (!quieto) document.querySelectorAll('[data-n]').forEach(function (el) {
    var n = el.getAttribute('data-n'), k = 0, t = setInterval(function () {
      el.textContent = k++ < 16 ? n.replace(/./g, function () { return '0123456789#%&'[Math.floor(Math.random() * 13)]; }) : n;
      if (k > 16) clearInterval(t);
    }, 50);
  });

  var gh = (d.perfil.enlaces || [])[0];
  document.getElementById('botones').innerHTML =
    (d.certificaciones.length ? '<a class="boton" href="#"><b>#</b> Certificaciones (' + d.certificaciones.length + ')</a>' : '') +
    d.tiposUsados.map(function (t) { return '<a class="boton" href="#"><b>#</b> ' + P.TIPOS[t] + '</a>'; }).join('') +
    (gh ? '<a class="boton gh" href="' + esc(gh.url) + '">' + esc(gh.nombre) + ' ↗</a>' : '');

  document.getElementById('proyectos').innerHTML = d.proyectos.slice(0, 6).map(function (p) {
    var img = d.portada(p.id);
    return '<article class="tarjeta"><div class="img">' + (img ? '<img src="' + esc(img) + '" alt="">' : '<div class="letra">' + esc(p.nombre.charAt(0)) + '_</div>') + '</div>' +
      '<div class="txt"><h4>' + esc(p.nombre) + '</h4><p>' + esc(p.que) + '</p>' +
      '<div class="pie"><span class="tipo">#' + esc(P.TIPO_UNO[p.tipo] || p.tipo) + '</span><span>' + esc((p.ia || []).join(' · ')) + '</span>' + (d.pasos(p.id) ? '<a href="#">' + d.pasos(p.id) + (d.pasos(p.id) === 1 ? ' paso' : ' pasos') + ' →</a>' : '<a>en marcha_</a>') + '</div></div></article>';
  }).join('');

  document.getElementById('log').innerHTML = d.logros.slice(0, 3).map(function (l) {
    var imgs = d.imagenes(l).filter(function (c) { return !/-390\./.test(c); }).slice(0, 3);
    return '<li><div class="meta">[' + esc(l.fecha) + '] <b>' + esc(d.proyecto(l.proyecto).nombre) + '</b> › ' + esc((l.ia || []).join(', ')) + '</div>' +
      '<h4>' + esc(l.titulo) + '</h4><p>' + esc(l.texto) + '</p>' +
      (imgs.length ? '<div class="tiras">' + imgs.map(function (s) { return '<img src="' + esc(s) + '" alt="">'; }).join('') + '</div>' : '') + '</li>';
  }).join('');
});
</script>
</body>
</html>
